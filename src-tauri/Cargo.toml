[package]
name = "onekey-updater"
version = "0.1.0"
description = "系统一键更新工具"
authors = ["Cookies"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "onekey_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
