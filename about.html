<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于</title>
  </head>
  <body>
    <div class="glass-root about-root">
      <header class="titlebar" id="titlebar">
        <div class="tb-left">
          <span class="tb-dot"></span>
          <span class="tb-title" data-i18n="about.title">关于</span>
        </div>
        <div class="tb-right">
          <button class="tb-btn tb-close" id="btnClose" title="关闭">
            <svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
          </button>
        </div>
      </header>

      <div class="about-scroll">
        <!-- 应用信息 -->
        <div class="about-hero">
          <div class="about-logo">
            <svg viewBox="0 0 64 64" width="56" height="56" fill="none">
              <circle cx="32" cy="32" r="28" stroke="var(--accent)" stroke-width="2.5" opacity="0.6"/>
              <path d="M20 34l8 8 16-18" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="32" cy="32" r="4" fill="var(--accent)" opacity="0.8"/>
            </svg>
          </div>
          <h1 class="about-app-name" data-i18n="about.appName">一键更新</h1>
          <div class="about-version-badge">
            <span data-i18n="about.version">版本</span>
            <span class="mono" id="appVersion">0.1.0</span>
          </div>
        </div>

        <p class="about-description" data-i18n="about.description">
          统一管理 npm、winget、pip、OpenClaw 四源软件更新的桌面工具。轻量、快速、无感。
        </p>

        <!-- 功能列表 -->
        <div class="about-section">
          <h3 data-i18n="about.features">主要功能</h3>
          <ul class="about-features">
            <li><span class="feature-dot"></span><span data-i18n="about.feature1">四源统一更新检查</span></li>
            <li><span class="feature-dot"></span><span data-i18n="about.feature2">应用内通知与系统通知</span></li>
            <li><span class="feature-dot"></span><span data-i18n="about.feature3">浅色/深色/跟随系统主题</span></li>
            <li><span class="feature-dot"></span><span data-i18n="about.feature4">忽略版本与永久忽略黑名单</span></li>
            <li><span class="feature-dot"></span><span data-i18n="about.feature5">开机自启动与自动检查</span></li>
          </ul>
        </div>

        <!-- 链接 -->
        <div class="about-section">
          <h3 data-i18n="about.github">GitHub</h3>
          <div class="about-links">
            <a href="https://github.com" target="_blank" class="about-link" id="linkGithub">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
              </svg>
              <span>GitHub Profile</span>
              <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l6-6M5 3h4v4"/></svg>
            </a>
            <a href="https://github.com" target="_blank" class="about-link" id="linkRepo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
              </svg>
              <span data-i18n="about.repository">源代码仓库</span>
              <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l6-6M5 3h4v4"/></svg>
            </a>
          </div>
        </div>

        <!-- 检查更新 -->
        <div class="about-section">
          <h3 data-i18n="about.checkUpdate">检查更新</h3>
          <div class="about-update">
            <button class="btn btn-primary" id="btnCheckUpdate">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 8a6 6 0 0110.5-4M14 8a6 6 0 01-10.5 4M12 2v3h3M4 14v-3H1"/></svg>
              <span data-i18n="about.checkUpdate">检查更新</span>
            </button>
            <div class="about-update-status" id="updateStatus" hidden></div>
          </div>
        </div>

        <div class="about-footer">
          <span data-i18n="about.madeWith">使用 Tauri 2 + Rust + TypeScript 构建</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/about.ts"></script>
  </body>
</html>
