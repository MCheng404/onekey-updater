[package]
name = "onekey-updater"
version = "2.1.0"
description = "系统一键更新工具"
authors = ["Cookies"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "onekey_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：开启后 tauri 才会把 frontendDist 的资源打进 exe，
# 否则会以 dev 模式启动、去连 devUrl（http://localhost:1420）→ 白屏/「无法访问此页面」。
# `npm run tauri build` 会自动带上；手动构建用 `--features custom-protocol`。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
